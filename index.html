<!doctype html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>We Chat</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

:root{
  --blue:#1877f2;
  --blue2:#5146e5;
  --bg:#f3f7fc;
  --card:#fff;
  --text:#182230;
  --muted:#6c7789;
  --line:#e5eaf1;
  --green:#18b56b;
  --red:#ef4050;
  --shadow:0 5px 22px rgba(30,60,100,.08)
}

body{
  font-family:Arial,"Noto Sans Bengali",sans-serif;
  background:var(--bg);
  color:var(--text);
  padding-bottom:82px
}

button,input,textarea{font:inherit}
button{border:0;cursor:pointer}
img{max-width:100%;display:block}
.hidden{display:none!important}

/* HEADER */

.top{
  height:78px;
  background:#fff;
  display:flex;
  align-items:center;
  gap:15px;
  padding:0 22px;
  position:sticky;
  top:0;
  z-index:100;
  box-shadow:0 2px 12px rgba(0,0,0,.05)
}

.logo{
  display:flex;
  align-items:center;
  gap:10px;
  cursor:pointer;
  min-width:220px
}

.logoIcon{
  width:55px;
  height:44px;
  border-radius:18px 18px 18px 6px;
  background:linear-gradient(135deg,#20a4ff,#4b35e7);
  color:#fff;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:24px;
  font-weight:bold
}

.logoText{
  font-family:Georgia,serif;
  color:#1765d4;
  font-size:30px;
  font-weight:bold
}

.logoSub{
  color:#748095;
  font-size:12px;
  margin-top:2px
}

.search{
  flex:1;
  max-width:500px;
  height:46px;
  border-radius:25px;
  background:#f1f5fa;
  display:flex;
  align-items:center;
  gap:9px;
  padding:0 16px
}

.search input{
  width:100%;
  border:0;
  outline:0;
  background:none
}

.topBtns{
  margin-left:auto;
  display:flex;
  align-items:center;
  gap:10px
}

.iconBtn{
  width:45px;
  height:45px;
  border-radius:50%;
  background:#f1f4f8;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:21px;
  position:relative
}

.badge{
  position:absolute;
  right:-2px;
  top:-3px;
  min-width:20px;
  height:20px;
  border-radius:12px;
  background:#ef3340;
  color:#fff;
  font-size:11px;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:0 5px
}

.miniAvatar{
  width:46px;
  height:46px;
  border-radius:50%;
  object-fit:cover;
  border:2px solid #fff;
  box-shadow:0 1px 6px #cbd4df;
  cursor:pointer
}

/* APP */

.app{
  width:min(100%,1050px);
  margin:18px auto;
  padding:0 12px
}

/* COMPOSER */

.composer{
  background:#fff;
  border-radius:22px;
  padding:18px;
  box-shadow:var(--shadow)
}

.composeTop{
  display:flex;
  gap:12px;
  align-items:center
}

.composeAvatar{
  width:55px;
  height:55px;
  border-radius:50%;
  object-fit:cover;
  cursor:pointer
}

.composeInput{
  flex:1;
  min-height:52px;
  border-radius:27px;
  background:#f1f5fa;
  display:flex;
  align-items:center;
  padding:0 20px;
  color:#69758a;
  cursor:pointer
}

.composeActions{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  margin-top:15px
}

.composeAction{
  background:#fff;
  padding:12px 5px;
  color:#394559;
  font-weight:600;
  border-right:1px solid var(--line)
}

.composeAction:last-child{border:0}

.actionIcon{
  margin-right:7px;
  font-size:20px
}

.red{color:#ef4050}
.green{color:#16ad67}
.purple{color:#7045df}
.orange{color:#f5a623}

/* STORIES */

.stories{
  margin-top:16px;
  background:#fff;
  padding:12px;
  border-radius:22px;
  box-shadow:var(--shadow);
  overflow:hidden
}

.storyRow{
  display:flex;
  gap:12px;
  overflow-x:auto;
  scrollbar-width:none
}

.storyRow::-webkit-scrollbar{display:none}

.story{
  flex:0 0 145px;
  height:205px;
  border-radius:17px;
  overflow:hidden;
  position:relative;
  background:#eaf1fa;
  cursor:pointer
}

.story>img:first-child{
  width:100%;
  height:100%;
  object-fit:cover
}

.storyShade{
  position:absolute;
  inset:0;
  background:linear-gradient(transparent 42%,rgba(0,0,0,.78))
}

.storyName{
  position:absolute;
  left:12px;
  bottom:13px;
  color:#fff;
  font-weight:bold;
  text-shadow:0 1px 3px #000
}

.storyAvatar{
  position:absolute;
  top:10px;
  left:10px;
  width:43px!important;
  height:43px!important;
  border-radius:50%;
  border:3px solid #1877f2;
  object-fit:cover!important
}

.createStory{
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  background:linear-gradient(160deg,#eaf4ff,#d9eaff)
}

.plusCircle{
  width:54px;
  height:54px;
  border-radius:50%;
  background:#1877f2;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:33px;
  margin-bottom:12px
}

/* FILTER */

.filters{
  display:flex;
  gap:10px;
  margin:16px 0;
  overflow-x:auto;
  scrollbar-width:none
}

.filters::-webkit-scrollbar{display:none}

.filter{
  min-width:125px;
  height:50px;
  border-radius:28px;
  background:#fff;
  color:#657085;
  font-weight:bold;
  box-shadow:0 2px 8px rgba(20,50,80,.04)
}

.filter.active{
  color:#fff;
  background:linear-gradient(135deg,#1877f2,#2868e8)
}

/* POST */

.post{
  background:#fff;
  border-radius:20px;
  margin-bottom:16px;
  overflow:hidden;
  box-shadow:var(--shadow)
}

.postHead{
  display:flex;
  align-items:center;
  padding:16px 17px 10px;
  gap:11px
}

.postAvatar{
  width:48px;
  height:48px;
  border-radius:50%;
  object-fit:cover;
  cursor:pointer
}

.postUser{flex:1}

.postUser b{
  font-size:16px;
  cursor:pointer
}

.postMeta{
  font-size:12px;
  color:#7c8797;
  margin-top:5px
}

.more{
  width:38px;
  height:38px;
  border-radius:50%;
  background:#f4f6f9;
  font-size:19px
}

.postText{
  padding:3px 18px 13px;
  font-size:16px;
  line-height:1.7;
  white-space:pre-wrap
}

.postImage{
  width:100%;
  max-height:620px;
  object-fit:cover
}

.postVideo{
  width:100%;
  max-height:620px;
  background:#000
}

.postStats{
  padding:10px 18px;
  display:flex;
  justify-content:space-between;
  color:#6c7789;
  font-size:14px
}

.postButtons{
  border-top:1px solid var(--line);
  display:grid;
  grid-template-columns:repeat(4,1fr)
}

.postButtons button{
  height:48px;
  background:#fff;
  color:#596579;
  font-weight:600
}

.postButtons button:hover{
  background:#f5f7fa
}

.liked{color:#e9314e!important}
.saved{color:#1877f2!important}

/* COMMENT BOX */

.commentBox{
  padding:10px 15px;
  border-top:1px solid var(--line);
  display:flex;
  gap:8px
}

.commentBox input{
  flex:1;
  border:0;
  outline:0;
  background:#f1f4f8;
  border-radius:20px;
  padding:9px 13px
}

.commentBox button{
  width:40px;
  border-radius:50%;
  background:#1877f2;
  color:#fff
}

.comments{
  padding:0 15px 10px
}

.comment{
  display:flex;
  gap:8px;
  margin-top:8px
}

.comment img{
  width:30px;
  height:30px;
  border-radius:50%;
  object-fit:cover
}

.commentText{
  background:#f2f4f8;
  border-radius:12px;
  padding:7px 10px;
  font-size:13px
}

/* BOTTOM */

.bottom{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  height:74px;
  background:#fff;
  box-shadow:0 -3px 15px rgba(0,0,0,.08);
  display:grid;
  grid-template-columns:repeat(4,1fr);
  z-index:200
}

.navBtn{
  background:#fff;
  color:#657085;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:3px;
  position:relative
}

.navBtn span:first-child{
  font-size:23px
}

.navBtn small{
  font-size:11px
}

.navBtn.active{
  color:#fff;
  background:#1877f2;
  border-radius:16px;
  transform:translateY(-1px);
  box-shadow:0 4px 12px rgba(24,119,242,.22)
}

.navBtn.active span:first-child{
  color:#fff
}

.navBtn.active small{
  color:#fff;
  font-weight:700
}

.addBtn{
  width:55px;
  height:55px;
  border-radius:18px;
  background:linear-gradient(135deg,#1877f2,#6d35e8);
  color:#fff;
  font-size:31px;
  display:flex;
  align-items:center;
  justify-content:center;
  margin-top:-18px;
  box-shadow:0 7px 17px rgba(45,100,230,.3)
}

/* MODAL */

.modal{
  position:fixed;
  inset:0;
  background:rgba(10,20,35,.55);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:600;
  padding:15px
}

.modal.show{
  display:flex
}

.modalBox{
  width:min(100%,540px);
  max-height:90vh;
  overflow:auto;
  background:#fff;
  border-radius:22px;
  padding:20px
}

.modalHead{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:18px
}

.close{
  width:38px;
  height:38px;
  border-radius:50%;
  background:#eef2f7;
  font-size:22px
}

.field{
  margin-bottom:13px
}

.field label{
  display:block;
  font-size:13px;
  font-weight:bold;
  color:#687386;
  margin-bottom:6px
}

.field input,
.field textarea{
  width:100%;
  border:1px solid #dfe5ed;
  border-radius:12px;
  padding:12px;
  outline:0
}

.field textarea{
  min-height:100px;
  resize:vertical
}

.primary{
  width:100%;
  height:48px;
  border-radius:13px;
  color:#fff;
  background:linear-gradient(135deg,#1877f2,#386bea);
  font-weight:bold
}

.secondary{
  width:100%;
  height:45px;
  border-radius:12px;
  background:#edf2f7;
  margin-top:9px;
  font-weight:bold
}

/* PROFILE */

.profile{
  background:#fff;
  border-radius:24px;
  overflow:hidden;
  box-shadow:var(--shadow)
}

.cover{
  height:240px;
  background:linear-gradient(135deg,#b8d8ff,#dfeaff);
  position:relative
}

.cover img{
  width:100%;
  height:100%;
  object-fit:cover
}

.coverEdit{
  position:absolute;
  right:15px;
  bottom:15px;
  background:#fff;
  border-radius:12px;
  padding:10px 14px;
  font-weight:bold
}

.profileInfo{
  padding:0 20px 20px;
  position:relative
}

.avatarWrap{
  position:relative;
  width:116px;
  margin-top:-58px
}

.profileAvatar{
  width:116px;
  height:116px;
  border-radius:50%;
  border:5px solid #fff;
  object-fit:cover;
  box-shadow:0 3px 12px #b8c3d0
}

.avatarEdit{
  position:absolute;
  right:2px;
  bottom:5px;
  width:34px;
  height:34px;
  border-radius:50%;
  background:#1877f2;
  color:#fff;
  border:3px solid #fff
}

.profileName{
  font-size:25px;
  margin-top:10px
}

.username{
  color:#728096;
  margin-top:4px
}

.bio{
  margin-top:12px;
  line-height:1.6;
  color:#4e596a
}

.profileMeta{
  display:flex;
  flex-wrap:wrap;
  gap:14px;
  margin-top:12px;
  color:#687386;
  font-size:13px
}

.profileActions{
  display:flex;
  gap:9px;
  margin-top:16px
}

.profileActions button{
  height:43px;
  padding:0 17px;
  border-radius:11px;
  font-weight:bold
}

.editBtn{
  background:#1877f2;
  color:#fff
}

.grayBtn{
  background:#edf2f7;
  color:#344054
}
.logoutBtn{
  background:#fff0f2;
  color:#e0314f;
  border:1px solid #ffd5dc
}

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  border-top:1px solid var(--line);
  border-bottom:1px solid var(--line);
  margin-top:20px
}

.stat{
  padding:15px 5px;
  text-align:center
}

.stat b{
  display:block;
  font-size:18px
}

.stat span{
  font-size:12px;
  color:#788396
}

.profileTabs{
  display:grid;
  grid-template-columns:repeat(5,1fr)
}

.profileTabs button{
  height:48px;
  background:#fff;
  color:#667085;
  font-weight:bold
}

.profileTabs button.active{
  color:#1877f2;
  border-bottom:3px solid #1877f2
}

/* PEOPLE */

.sectionTitle{
  font-size:20px;
  margin:10px 0 15px
}

.person{
  background:#fff;
  border-radius:16px;
  padding:13px;
  display:flex;
  align-items:center;
  gap:12px;
  margin-bottom:10px;
  box-shadow:var(--shadow)
}

.person img{
  width:55px;
  height:55px;
  border-radius:50%;
  object-fit:cover
}

.personInfo{
  flex:1
}

.personInfo b{
  display:block
}

.personInfo small{
  color:#788396
}

.person button{
  background:#1877f2;
  color:#fff;
  border-radius:10px;
  padding:9px 13px
}

/* CHAT */

.chatList{
  margin-top:5px
}

.chatItem{
  background:#fff;
  padding:13px;
  display:flex;
  align-items:center;
  gap:12px;
  border-radius:15px;
  margin-bottom:8px;
  box-shadow:var(--shadow)
}

.chatItem img{
  width:53px;
  height:53px;
  border-radius:50%;
  object-fit:cover
}

.chatInfo{
  flex:1
}

.chatInfo b{
  display:block
}

.chatInfo small{
  color:#788396
}

.chatWindow{
  position:fixed;
  inset:0;
  background:#f4f7fb;
  z-index:500;
  display:none;
  flex-direction:column
}

.chatWindow.show{
  display:flex
}

.chatTop{
  height:65px;
  background:#fff;
  display:flex;
  align-items:center;
  gap:12px;
  padding:10px 15px;
  box-shadow:0 2px 8px #ddd
}

.chatTop img{
  width:42px;
  height:42px;
  border-radius:50%;
  object-fit:cover
}

.chatMessages{
  flex:1;
  overflow:auto;
  padding:15px
}

.msg{
  max-width:75%;
  padding:10px 13px;
  border-radius:15px;
  margin-bottom:8px;
  line-height:1.45
}

.msg.me{
  margin-left:auto;
  background:#1877f2;
  color:#fff;
  border-bottom-right-radius:4px
}

.msg.other{
  background:#fff;
  border-bottom-left-radius:4px
}

.chatInput{
  background:#fff;
  padding:10px;
  display:flex;
  gap:8px
}

.chatInput input{
  flex:1;
  border:0;
  background:#f1f4f8;
  border-radius:22px;
  padding:11px 15px;
  outline:0
}

.send{
  width:46px;
  height:46px;
  border-radius:50%;
  background:#1877f2;
  color:#fff
}

/* STORY VIEW */

.storyViewer{
  position:fixed;
  inset:0;
  background:#000;
  z-index:1000;
  display:none;
  align-items:center;
  justify-content:center
}

.storyViewer.show{
  display:flex
}

.storyViewer img{
  max-width:100%;
  max-height:100%;
  object-fit:contain
}

.storyClose{
  position:absolute;
  top:20px;
  right:20px;
  width:45px;
  height:45px;
  border-radius:50%;
  background:rgba(255,255,255,.15);
  color:#fff;
  font-size:28px;
  z-index:2
}

.storyInfo{
  position:absolute;
  top:20px;
  left:20px;
  color:#fff;
  display:flex;
  align-items:center;
  gap:10px
}

.storyInfo img{
  width:42px;
  height:42px;
  border-radius:50%;
  object-fit:cover
}

/* STORY REACTIONS */

.storyReactionPanel{
  position:absolute;
  left:50%;
  bottom:24px;
  transform:translateX(-50%);
  width:min(92%,430px);
  z-index:3;
  text-align:center
}

.storyReactionButtons{
  display:flex;
  justify-content:center;
  gap:10px;
  flex-wrap:wrap
}

.storyReactionBtn{
  border-radius:24px;
  padding:10px 15px;
  background:rgba(255,255,255,.94);
  color:#182230;
  font-weight:700;
  box-shadow:0 4px 16px rgba(0,0,0,.2)
}

.storyReactionBtn.selected{
  background:#1877f2;
  color:#fff
}

.storyReactionCounts{
  display:inline-flex;
  gap:10px;
  flex-wrap:wrap;
  justify-content:center;
  padding:10px 14px;
  border-radius:22px;
  background:rgba(0,0,0,.62);
  color:#fff;
  font-weight:700
}

/* RESPONSIVE */

@media(max-width:700px){

  .top{
    height:68px;
    padding:0 10px;
    gap:9px
  }

  .logo{
    min-width:auto
  }

  .logoText{
    font-size:23px
  }

  .logoSub{
    display:none
  }

  .logoIcon{
    width:43px;
    height:36px;
    font-size:20px
  }

  .search{
    max-width:none;
    height:40px
  }

  .topBtns .iconBtn{
    display:none
  }

  .miniAvatar{
    width:40px;
    height:40px
  }

  .app{
    margin:10px auto;
    padding:0 8px
  }

  .composer{
    padding:13px;
    border-radius:17px
  }

  .composeActions{
    grid-template-columns:repeat(4,1fr)
  }

  .composeAction{
    font-size:12px
  }

  .actionIcon{
    display:block;
    margin:0 0 2px
  }

  .story{
    flex-basis:125px;
    height:180px
  }

  .post{
    border-radius:16px
  }

  .postImage{
    max-height:450px
  }

  .cover{
    height:190px
  }

  .profileInfo{
    padding:0 15px 18px
  }

  .stats{
    grid-template-columns:repeat(4,1fr)
  }

  .profileTabs button{
    font-size:11px
  }
}

@media(max-width:420px){

  .logoText{
    font-size:20px
  }

  .search{
    display:none
  }

  .composeInput{
    font-size:13px
  }

  .filter{
    min-width:100px
  }

  .postButtons button{
    font-size:12px
  }
}

.friendsTabs{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;background:#eaf2ff;padding:6px;border-radius:15px;margin:0 0 14px}
.friendsTab{border:0;background:transparent;color:#516070;padding:10px 7px;border-radius:11px;font-weight:800;font-size:12px;cursor:pointer}
.friendsTab.active{background:#1877f2;color:#fff;box-shadow:0 3px 10px rgba(24,119,242,.2)}
.tabBadge{display:inline-flex;min-width:18px;height:18px;padding:0 5px;align-items:center;justify-content:center;border-radius:99px;background:#e9314e;color:#fff;font-size:10px;margin-left:3px}
.notificationItem{display:flex;gap:11px;align-items:center;padding:13px;border-bottom:1px solid #edf1f6}
.notificationItem:last-child{border-bottom:0}
.notificationIcon{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:#edf4ff;font-size:20px;flex:none}
.notificationItem.unread{background:#f4f8ff}
.notificationText{flex:1;min-width:0}.notificationText b{display:block}.notificationText small{color:#6b7785}
.soundSettings{display:grid;gap:12px}
.soundRow{background:#f7f9fc;border:1px solid #e5eaf1;border-radius:15px;padding:13px}
.soundRowTop{display:flex;align-items:center;gap:10px}
.soundRowTop b{flex:1}
.soundRow select{width:100%;margin-top:9px;border:1px solid #dfe5ed;border-radius:10px;background:#fff;padding:10px;outline:0}
.soundActions{display:flex;gap:7px;margin-top:9px}
.soundActions button{padding:8px 11px;border-radius:10px;background:#e9f1ff;color:#1765d4;font-weight:700}
.soundToggle{width:20px;height:20px;accent-color:#1877f2}
</style>
</head>

<body>

const firebaseApp=initializeApp(firebaseConfig);

/* STATE */

let me=null;

let myUser=null;

let users={};

let posts=[];

let friends=[];

let requests=[];
let outgoingRequests=[];

let messages=[];

let stories=[];
let storyReactions=[];

let savedPosts=[];
let notifications=[];
let friendsTab="friends";
let notificationSeenIds=new Set();

let soundRequestSeenIds=new Set();
let soundMessageSeenIds=new Set();
let soundNotificationSeenIds=new Set();
let soundRequestInitialized=false;
let soundMessageInitialized=false;
let soundNotificationInitialized=false;
let soundAudioContext=null;

const SOUND_DEFAULTS={
  friend:{enabled:true,sound:"ting"},
  message:{enabled:true,sound:"beep2"},
  notification:{enabled:true,sound:"pop"}
};

function getSoundSettings(){
  try{
    const raw=localStorage.getItem("weChatSoundSettings");
    const saved=raw?JSON.parse(raw):{};
    return {
      friend:{...SOUND_DEFAULTS.friend,...(saved.friend||{})},
      message:{...SOUND_DEFAULTS.message,...(saved.message||{})},
      notification:{...SOUND_DEFAULTS.notification,...(saved.notification||{})}
    };
  }catch{
    return JSON.parse(JSON.stringify(SOUND_DEFAULTS));
  }
}

function saveSoundSettingsLocal(settings){
  try{localStorage.setItem("weChatSoundSettings",JSON.stringify(settings));}catch{}
}

function getAudioContext(){
  try{
    if(!soundAudioContext){
      const AC=window.AudioContext||window.webkitAudioContext;
      if(!AC) return null;
      soundAudioContext=new AC();
    }
    if(soundAudioContext.state==="suspended") soundAudioContext.resume().catch(()=>{});
    return soundAudioContext;
  }catch{return null;}
}

function tone(ctx,frequency,start,duration,type="sine",volume=.055){
  const osc=ctx.createOscillator();
  const gain=ctx.createGain();
  osc.type=type;
  osc.frequency.setValueAtTime(frequency,start);
  gain.gain.setValueAtTime(0.0001,start);
  gain.gain.exponentialRampToValueAtTime(volume,start+.018);
  gain.gain.exponentialRampToValueAtTime(0.0001,start+duration);
  osc.connect(gain);
  gain.connect(ctx.destination);
  osc.start(start);
  osc.stop(start+duration+.03);
}

function playPreset(name){
  const ctx=getAudioContext();
  if(!ctx) return;
  const t=ctx.currentTime+.01;
  if(name==="ting"){ tone(ctx,880,t,.16,"sine",.06); tone(ctx,1320,t+.12,.22,"sine",.045); }
  else if(name==="doubleTing"){ tone(ctx,880,t,.14,"sine",.055); tone(ctx,1100,t+.18,.16,"sine",.05); }
  else if(name==="beep"){ tone(ctx,620,t,.16,"square",.035); }
  else if(name==="beep2"){ tone(ctx,620,t,.12,"square",.035); tone(ctx,780,t+.17,.14,"square",.03); }
  else if(name==="chime"){ tone(ctx,740,t,.18,"sine",.045); tone(ctx,988,t+.14,.28,"sine",.04); }
  else if(name==="pop"){ tone(ctx,520,t,.08,"sine",.055); tone(ctx,820,t+.06,.12,"sine",.045); }
}

function playEventSound(type){
  const settings=getSoundSettings();
  const item=settings[type];
  if(item?.enabled) playPreset(item.sound);
}

window.openSoundSettings=function(){
  const s=getSoundSettings();
  document.getElementById("soundFriendEnabled").checked=!!s.friend.enabled;
  document.getElementById("soundFriendSelect").value=s.friend.sound;
  document.getElementById("soundMessageEnabled").checked=!!s.message.enabled;
  document.getElementById("soundMessageSelect").value=s.message.sound;
  document.getElementById("soundNotificationEnabled").checked=!!s.notification.enabled;
  document.getElementById("soundNotificationSelect").value=s.notification.sound;
  document.getElementById("soundModal").classList.add("show");
  getAudioContext();
};

window.saveSoundSettings=function(){
  const settings={
    friend:{enabled:document.getElementById("soundFriendEnabled").checked,sound:document.getElementById("soundFriendSelect").value},
    message:{enabled:document.getElementById("soundMessageEnabled").checked,sound:document.getElementById("soundMessageSelect").value},
    notification:{enabled:document.getElementById("soundNotificationEnabled").checked,sound:document.getElementById("soundNotificationSelect").value}
  };
  saveSoundSettingsLocal(settings);
  playPreset("pop");
  alert("Sound settings saved!");
  closeModal("soundModal");
};

window.testSound=function(type){
  const map={
    friend:["soundFriendEnabled","soundFriendSelect"],
    message:["soundMessageEnabled","soundMessageSelect"],
    notification:["soundNotificationEnabled","soundNotificationSelect"]
  };
  const pair=map[type];
  if(!pair) return;
  const enabled=document.getElementById(pair[0]).checked;
  const sound=document.getElementById(pair[1]).value;
  if(enabled) playPreset(sound);
};

let currentChat=null;

let currentPage="home";

let stopFns=[];


/* DEFAULT AVATAR */

const defaultAvatar=
"data:image/svg+xml;charset=UTF-8,"+
encodeURIComponent(`
<svg xmlns="http://www.w3.org/2000/svg"
width="300" height="300">
<rect width="300" height="300" fill="#e8eef6"/>
<circle cx="150" cy="110" r="62" fill="#9aa9bd"/>
<circle cx="150" cy="310" r="105" fill="#9aa9bd"/>
</svg>
`);


/* AUTH */

onAuthStateChanged(auth,async user=>{

  if(!user){

    me=null;
    window.me=null;
    showLoginMessage();

    return;

  }

  me=user;
  window.me=user;
  window.currentUser=user;

  document.querySelector(".bottom").style.display="grid";

  await ensureUser();

  startListeners();

  showPage("home");

});


/* LOGIN MESSAGE */

function showLoginMessage(){

  document.querySelector(".bottom").style.display="none";

  document.getElementById("app").innerHTML=`

    <div class="post"
      style="
      padding:35px;
      text-align:center;
      margin-top:50px;
      "
    >

      <div
        class="logoIcon"
        style="margin:auto"
      >
        •••
      </div>

      <h2 style="margin-top:15px">
        We Chat
      </h2>

      <p style="
        color:#687386;
        margin-top:8px
      ">
        Please sign in first.
      </p>

    </div>

  `;

}


/* USER */

async function ensureUser(){

  const ref=doc(
    db,
    "users",
    me.uid
  );

  const snap=await getDoc(ref);

  if(!snap.exists()){

    await setDoc(ref,{

      uid:me.uid,

      name:
      me.displayName ||
      "We Chat User",

      username:
      "user_"+me.uid.slice(0,6),

      email:
      me.email || "",

      photoURL:
      me.photoURL ||
      defaultAvatar,

      coverURL:"",

      bio:"",

      location:"",

      online:true,

      joinedAt:
      serverTimestamp()

    });

  }else{

    await updateDoc(ref,{
      online:true
    });

  }

}


/* LISTENERS */

function startListeners(){

  stopFns.forEach(
    fn=>fn && fn()
  );

  stopFns=[];


  /* USERS */

  stopFns.push(

    onSnapshot(
      collection(db,"users"),

      snap=>{

        users={};

        snap.forEach(d=>{

          users[d.id]={
            uid:d.id,
            ...d.data()
          };

        });

        myUser=
        users[me.uid] ||
        myUser;

        updateTop();

        if(currentPage==="profile"){
          viewProfile(window.me?.uid);
        }

      }

    )

  );


  /* POSTS */

  stopFns.push(

    onSnapshot(

      query(
        collection(db,"posts"),
        orderBy("createdAt","desc"),
        limit(50)
      ),

      snap=>{

        posts=[];

        snap.forEach(d=>{

          posts.push({
            id:d.id,
            ...d.data()
          });

        });

        if(
          currentPage==="home" ||
          currentPage==="explore"
        ){

          renderCurrent();

        }

      }

    )

  );


  /* FRIEND REQUESTS */

  stopFns.push(

    onSnapshot(
      collection(db,"friendRequests"),

      snap=>{

        requests=[];
        outgoingRequests=[];

        snap.forEach(d=>{

          const x={
            id:d.id,
            ...d.data()
          };

          if(x.to===me.uid){
            requests.push(x);
          }
          if(x.from===me.uid){
            outgoingRequests.push(x);
          }

        });

        if(soundRequestInitialized){
          const newIncoming=requests.filter(r=>!soundRequestSeenIds.has(r.id));
          newIncoming.forEach(()=>playEventSound("friend"));
        }
        soundRequestSeenIds=new Set(requests.map(r=>r.id));
        soundRequestInitialized=true;

        updateRequestBadge();

        if(currentPage==="requests" || currentPage==="friends"){
          renderCurrent();
        }

      }

    )

  );


  /* NOTIFICATIONS */

  stopFns.push(
    onSnapshot(
      collection(db,"notifications"),
      snap=>{
        notifications=[];
        snap.forEach(d=>{
          const x={id:d.id,...d.data()};
          if(x.to===me.uid) notifications.push(x);
        });
        notifications.sort((a,b)=>{
          const at=a.createdAt?.toMillis ? a.createdAt.toMillis() : (a.createdAt || 0);
          const bt=b.createdAt?.toMillis ? b.createdAt.toMillis() : (b.createdAt || 0);
          return bt-at;
        });
        notifications=notifications.slice(0,100);
        if(soundNotificationInitialized){
          const newNotifications=notifications.filter(n=>!soundNotificationSeenIds.has(n.id) && n.type!=="friend_request");
          newNotifications.forEach(()=>playEventSound("notification"));
        }
        soundNotificationSeenIds=new Set(notifications.map(n=>n.id));
        soundNotificationInitialized=true;
        updateNotificationBadge();
        if(currentPage==="notifications") renderNotifications();
      },
      error=>{
        console.error("Notification listener:",error);
      }
    )
  );


  /* FRIENDS */

  stopFns.push(

    onSnapshot(
      collection(db,"friends"),

      snap=>{

        friends=[];

        snap.forEach(d=>{

          const x={
            id:d.id,
            ...d.data()
          };

          if(
            x.from===me.uid ||
            x.to===me.uid
          ){

            friends.push(x);

          }

        });

        if(currentPage==="friends"){
          renderFriends();
        }

      }

    )

  );


  /* MESSAGES */

  stopFns.push(

    onSnapshot(

      query(
        collection(db,"messages"),
        orderBy("createdAt","asc"),
        limit(300)
      ),

      snap=>{

        messages=[];

        snap.forEach(d=>{

          const x={
            id:d.id,
            ...d.data()
          };

          if(
            x.from===me.uid ||
            x.to===me.uid
          ){

            messages.push(x);

          }

        });

        if(soundMessageInitialized){
          const newIncoming=messages.filter(m=>m.to===me.uid && !soundMessageSeenIds.has(m.id));
          newIncoming.forEach(m=>{
            if(currentChat!==m.from) playEventSound("message");
          });
        }
        soundMessageSeenIds=new Set(messages.map(m=>m.id));
        soundMessageInitialized=true;

        if(currentChat){
          renderChatMessages();
        }

      }

    )

  );


  /* STORIES */

  stopFns.push(

    onSnapshot(
      collection(db,"stories"),

      async snap=>{

        stories=[];

        const now=Date.now();

        const expired=[];

        snap.forEach(d=>{

          const x={
            id:d.id,
            ...d.data()
          };

          if(
            x.expiresAt &&
            x.expiresAt>now
          ){

            stories.push(x);

          }else if(
            x.expiresAt &&
            x.expiresAt<=now
          ){

            expired.push(x);

          }

        });


        /* DELETE EXPIRED */

        for(
          const story of expired
        ){

          try{

            await deleteDoc(
              doc(
                db,
                "stories",
                story.id
              )
            );

          }catch(error){

            console.log(
              "Expired story:",
              error
            );

          }

        }


        if(currentPage==="home"){
          renderCurrent();
        }

      }

    )

  );


  /* SAVED POSTS */

  stopFns.push(

    onSnapshot(
      collection(db,"savedPosts"),

      snap=>{

        savedPosts=[];

        snap.forEach(d=>{

          const x={
            id:d.id,
            ...d.data()
          };

          if(x.uid===me.uid){
            savedPosts.push(x.postId);
          }

        });

      }

    )

  );

}

  if(page==="home")
    document
    .getElementById("navHome")
    ?.classList.add("active");

    ?.classList.add("active");

/* RENDER CURRENT */

function renderCurrent(){

  if(currentPage==="home"){
    renderHome();
    return;
  }

  if(currentPage==="explore"){
    renderExplore();
    return;
  }

  if(currentPage==="requests"){
    renderRequests();
    return;
  }

  if(currentPage==="notifications"){
    renderNotifications();
    return;
  }

  if(currentPage==="friends"){
    renderFriends();
    return;
  }

  if(currentPage==="chats"){
    renderChats();
    return;
  }

}

  document.getElementById("app").innerHTML=`

        </div>

      </div>


      <div class="composeActions">

        <button
          class="composeAction"
          onclick="openPost('post')"
        >
          <span class="actionIcon red">
            📝
          </span>
          Post
        </button>


        <button
          class="composeAction"
          onclick="openPost('photo')"
        >
          <span class="actionIcon green">
            ▣

/* STORIES */

function renderStories(){

  const now=Date.now();


  const active=
  stories
  .filter(
    s=>
    s.imageURL &&
    s.expiresAt &&
    s.expiresAt>now
  )
  .sort(
    (a,b)=>
    (b.createdAt?.seconds || 0)-
    (a.createdAt?.seconds || 0)
  );


  const grouped=[];

  const used=new Set();


  active.forEach(story=>{

    if(used.has(story.uid))
      return;

    const user=users[story.uid];

    if(!user)
      return;

    grouped.push({
      story,
      user
    });

    used.add(story.uid);

  });


  return `

    <section class="stories">

      <div class="storyRow">


        <!-- CREATE STORY -->

        <div
          class="story createStory"
          onclick="createStory()"
        >

          <div class="plusCircle">
            +
          </div>

          <b>
            Create Story
          </b>

        </div>


        ${grouped.map(x=>`

          <div
            class="story"
            onclick="viewStory('${x.story.id}')"
          >

            <img
              src="${x.story.imageURL}"
            >

            <div class="storyShade"></div>

            <img
              class="storyAvatar"
              src="${
                x.user.photoURL ||
                defaultAvatar
              }"
            >

            <div class="storyName">
              ${esc(
                x.user.name ||
                "User"
              )}
            </div>

          </div>

        `).join("")}


      </div>

    </section>

  `;

}

/* UPLOAD STORY */

window.uploadStory=async function(event){

  const file=
  event.target.files?.[0];

  if(!file)
    return;


  if(!file.type.startsWith("image/")){

    alert(
      "শুধু ছবি নির্বাচন করুন।"
    );

    return;

  }


  try{

    const imageURL=
    await resizeImage(
      file,
      800,
      .55
    );


    const createdAt=
    Date.now();


    const expiresAt=
    createdAt+
    24*60*60*1000;


    await addDoc(
      collection(db,"stories"),
      {

        uid:me.uid,

        imageURL,

        createdAt:

          serverTimestamp(),

        expiresAt

      }
    );


    alert(
      "Story added successfully!"
    );


  }catch(error){

    console.error(error);

    alert(
      "Story upload করা যায়নি।"
    );

  }

};


/* STORY REACTIONS */

window.currentStoryId=null;

window.reactToStory=async function(storyId,type){

  if(!me || !storyId || !type)
    return;

  const allowed=["heart","sad","laugh"];

  if(!allowed.includes(type))
    return;

  const story=stories.find(s=>s.id===storyId);

  if(!story)
    return;

  try{

    await setDoc(
      doc(db,"storyReactions",`${storyId}_${me.uid}`),
      {
        storyId,
        storyOwnerUid:story.uid,
        uid:me.uid,
        type,
        createdAt:serverTimestamp()
      }
    );

    await createNotification(
      story.uid,
      "story_reaction",
      me.uid,
      `reacted ${type} to your story`,
      {storyId}
    );

    renderStoryReactionPanel(storyId);

  }catch(error){

    console.error(error);
    alert("Reaction দেওয়া যায়নি।");

  }

};


function renderStoryReactionPanel(storyId){

  const panel=document.getElementById("storyReactionPanel");

  if(!panel)
    return;

  const story=stories.find(s=>s.id===storyId);

  if(!story || !me){
    panel.innerHTML="";
    return;
  }

  const mine=storyReactions.find(
    r=>r.storyId===storyId && r.uid===me.uid
  );

  if(story.uid===me.uid){

    const own=storyReactions.filter(
      r=>r.storyId===storyId
    );

    const heart=own.filter(r=>r.type==="heart").length;
    const sad=own.filter(r=>r.type==="sad").length;
    const laugh=own.filter(r=>r.type==="laugh").length;

    panel.innerHTML=`
      <div class="storyReactionCounts">
        ❤️ ${heart}
        <span>😢 ${sad}</span>
        <span>😂 ${laugh}</span>
      </div>
    `;

    return;
  }

  panel.innerHTML=`
    <div class="storyReactionButtons">
      <button
        class="storyReactionBtn ${mine?.type==="heart" ? "selected" : ""}"
        onclick="reactToStory('${storyId}','heart')"
      >❤️ সুন্দর</button>

      <button
        class="storyReactionBtn ${mine?.type==="sad" ? "selected" : ""}"
        onclick="reactToStory('${storyId}','sad')"
      >😢 Sad</button>

      <button
        class="storyReactionBtn ${mine?.type==="laugh" ? "selected" : ""}"
        onclick="reactToStory('${storyId}','laugh')"
      >😂 হাসি</button>
    </div>
  `;

}

/* LIKE */

window.likePost=async function(id){

  const ref=
  doc(db,"posts",id);

  const snap=
  await getDoc(ref);


  if(!snap.exists())
    return;


  const data=snap.data();

  let likes=
  data.likes || [];

  const wasLiked=likes.includes(me.uid);

  if(wasLiked){

    likes=
    likes.filter(
      x=>x!==me.uid
    );

  }else{

    likes.push(me.uid);

  }


  await updateDoc(
    ref,
    {likes}
  );

  if(!wasLiked){
    await createNotification(
      data.uid,
      "post_like",
      me.uid,
      "liked your post",
      {postId:id}
    );
  }

};

window.addComment=async function(id){

  const input=
  document
  .getElementById(
    "commentInput-"+id
  );


  const text=
  input.value.trim();


  if(!text)
    return;


  const ref=
  doc(db,"posts",id);

  const snap=
  await getDoc(ref);


  if(!snap.exists())
    return;


  const comments=
  snap.data().comments || [];


  comments.push({

    uid:me.uid,

    text,

    createdAt:
    Date.now()

  });


  await updateDoc(
    ref,
    {comments}
  );

  await createNotification(
    snap.data().uid,
    "post_comment",
    me.uid,
    "commented on your post",
    {postId:id}
  );

  input.value="";

};


/* SHARE */

window.sharePost=async function(id){

  const url=
  location.origin+
  location.pathname+
  "?post="+
  encodeURIComponent(id);


  if(
    navigator.share
  ){

    try{

      await navigator.share({
        title:"We Chat Post",
        url
      });

      return;

    }catch{}

  }


  try{

    await navigator.clipboard
    .writeText(url);

    alert(
      "Post link copied!"
    );

  }catch{

    prompt(
      "Copy this link:",
      url
    );

  }

};

window.savePost=async function(id){

  const existing=
  savedPosts.includes(id);


  const saveId=
  me.uid+"_"+id;


  if(existing){

    await deleteDoc(
      doc(
        db,
        "savedPosts",
        saveId

  }else{

    await setDoc(
      doc(
        db,
        "savedPosts",
        saveId

      {

        uid:me.uid,

        postId:id,

        createdAt:
        serverTimestamp()

    );

  }

};

/* FRIEND IDs */

function getFriendIds(uid){

  const ids=[];


  friends.forEach(f=>{

    if(f.from===uid)
      ids.push(f.to);

    if(f.to===uid)
      ids.push(f.from);

  });


  return [
    ...new Set(ids)
  ]
  .filter(x=>users[x]);

}


/* FRIEND REQUEST */

window.sendFriendRequest=async function(uid){

  if(!uid || uid===me.uid)
    return;


  const alreadyFriend=
  getFriendIds(me.uid)
  .includes(uid);


  if(alreadyFriend){

    alert(
      "Already friends."
    );

    return;

  }


  const exists=
  outgoingRequests.find(
    r=>
    r.from===me.uid &&
    r.to===uid
  );


  if(exists){

    alert(
      "Friend request already sent."
    );

    return;

  }


  await addDoc(
    collection(db,"friendRequests"),
    {

      from:me.uid,

      to:uid,

      createdAt:
      serverTimestamp()

    }
  );

  await createNotification(
    uid,
    "friend_request",
    me.uid,
    "sent you a friend request"
  );

  alert(
    "Friend request sent!"
  );

};


async function createNotification(to,type,actorUid,text,extra={}){
  if(!me || !to || to===me.uid) return;
  try{
    await addDoc(collection(db,"notifications"),{
      to,
      type,
      actorUid:actorUid || me.uid,
      text,
      read:false,
      createdAt:serverTimestamp(),
      ...extra
    });
  }catch(error){
    console.error("Notification create failed:",error);
  }
}

/* IMAGE COMPRESS */

async function resizeImage(
  file,
  maxSize,
  quality
){

  return new Promise(
    (resolve,reject)=>{

      const reader=
      new FileReader();


      reader.onload=e=>{

        const img=
        new Image();


        img.onload=()=>{

          let w=img.width;

          let h=img.height;


          if(
            w>maxSize ||
            h>maxSize
          ){

            const scale=
            Math.min(
              maxSize/w,
              maxSize/h
            );


            w=
            Math.round(
              w*scale
            );


            h=
            Math.round(
              h*scale
            );

          }


          const canvas=
          document.createElement(
            "canvas"
          );


          canvas.width=w;

          canvas.height=h;


          const ctx=
          canvas.getContext(
            "2d"
          );


          ctx.drawImage(
            img,
            0,
            0,
            w,
            h
          );


          resolve(
            canvas.toDataURL(
              "image/jpeg",
              quality
            )
          );

        };


        img.onerror=reject;

        img.src=e.target.result;

      };


      reader.onerror=reject;

      reader.readAsDataURL(file);

    }
  );

}

/* TIME */

function timeAgo(timestamp){

  if(!timestamp)
    return "Just now";


  let date;


  try{

    date=
    timestamp.toDate();

  }catch{

    date=
    new Date();

  }


  const diff=
  Math.floor(
    (
      Date.now()-
      date.getTime()
    )/1000
  );


  if(diff<60)
    return "Just now";


  if(diff<3600)
    return (
      Math.floor(diff/60)+
      " min ago"
    );


  if(diff<86400)
    return (
      Math.floor(diff/3600)+
      " hours ago"
    );


  return (
    Math.floor(diff/86400)+
    " days ago"
  );

}


/* ESCAPE HTML */

function esc(value=""){

  return String(value)

  .replaceAll(
    "&",
    "&amp;"
  )

  .replaceAll(
    "<",
    "&lt;"
  )

  .replaceAll(
    ">",
    "&gt;"
  )

  .replaceAll(
    '"',
    "&quot;"
  )

  .replaceAll(
    "'",
    "&#039;"
  );

}
